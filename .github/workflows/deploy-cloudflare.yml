# Deploys the current branch to Cloudflare Workers via OpenNext.
#
# One-time setup (see docs/DEPLOY.md):
#   1. Create a Cloudflare API token (Workers Scripts:Edit + the
#      account permissions listed in the runbook) and add it as the
#      CLOUDFLARE_API_TOKEN GitHub Actions secret, with the account id
#      as CLOUDFLARE_ACCOUNT_ID.
#   2. Create the Hyperdrive config and put its id in wrangler.jsonc.
#   3. Set the Worker secrets once with `wrangler secret put`.
#   4. Add the DATABASE_URL Actions secret (Supabase Postgres) so this
#      workflow can run migrations before deploying. Migrations run in
#      this single job, never inside the Worker, so they cannot race.
#
# Trigger manually from the Actions tab (workflow_dispatch) so deploys
# are always an explicit human action.
name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The same gates that protect local releases protect deploys.
      # CI-only placeholder env: build-time validation needs values
      # present; none of these reach Cloudflare, whose Worker secrets
      # hold the real ones.
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm test
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
          TWO_FACTOR_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

      - name: Build Worker (OpenNext)
        run: npm run build:cloudflare
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
          TWO_FACTOR_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          SITE_URL: https://porscha.today

      - name: Guard deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not configured. See docs/DEPLOY.md."
            exit 1
          fi

      # Explicit, race-free migration step: one job, one runner, using
      # drizzle-orm's migrator against the same journal as db:migrate.
      # The Worker itself never runs migrations.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured; refusing to deploy unmigrated. See docs/DEPLOY.md."
            exit 1
          fi
          node scripts/migrate.mjs

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live site
        run: node scripts/verify-production.mjs https://porscha.today
